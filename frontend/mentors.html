<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mentors</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav><a href="index.html">Dashboard</a><a href="teams.html">Teams</a><a href="ps.html">Problem Statements</a><a href="mentors.html" class="on">Mentors</a><a href="deliverables.html">Deliverables</a></nav>
<div class="wrap">
<h2>Assign a mentor</h2>
<div class="steps"><div class="step on">Step 1 – See load</div><div class="step">Step 2 – Assign</div></div>
<div class="card"><table id="t"></table>
<p><small>Load shows teams per mentor. Full mentors are blocked automatically.</small></p></div>
<div class="card">
<p class="hint">Pick team + mentor from lists, or one-click auto-assign to the free-est mentor.</p>
<label>Team</label><select id="teamSel"></select>
<label>Mentor</label><select id="mentorSel"></select><br><br>
<button onclick="assign()">Assign chosen</button>
<button class="ghost" onclick="autoAssign()">Auto-assign free-est</button> <small id="m"></small>
</div></div>
<script src="js/app.js"></script>
<script>
async function load() {
  try {
  const teams = await get('/teams');
  document.getElementById('teamSel').innerHTML = teams.map(t => `<option value="${esc(t.id)}">${esc(t.teamName)} (${esc(t.mentorName)})</option>`).join('');
  const ms = await get('/mentors');
  document.getElementById('mentorSel').innerHTML = ms.map(x => `<option value="${esc(x.id)}">${esc(x.name)} – ${x.load}/${x.maxTeams}</option>`).join('');
  document.getElementById('t').innerHTML = '<tr><th>Name</th><th>Dept</th><th>Load</th></tr>' +
    ms.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.dept)}</td><td>${x.load}/${x.maxTeams}</td></tr>`).join('');
  } catch (e) { loadFailed('t', e); }
}
async function assign() {
  try {
    const t = await post(`/teams/${document.getElementById('teamSel').value}/assign-mentor`, { mentorId: document.getElementById('mentorSel').value });
    document.getElementById('m').textContent = t.teamName + ' → ' + t.mentorName; load();
  } catch (e) { document.getElementById('m').textContent = e.message; }
}
async function autoAssign() {
  try {
    const t = await post(`/teams/${document.getElementById('teamSel').value}/auto-mentor`, {});
    document.getElementById('m').textContent = t.teamName + ' → ' + t.mentorName; load();
  } catch (e) { document.getElementById('m').textContent = e.message; }
}
load();
</script></body></html>
