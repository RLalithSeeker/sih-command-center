<!doctype html><html><head><meta charset="utf-8"><title>SIH Command Center</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<nav><a href="index.html" class="on">Dashboard</a><a href="teams.html">Teams</a><a href="ps.html">Problem Statements</a><a href="mentors.html">Mentors</a><a href="deliverables.html">Deliverables</a></nav>
<div class="wrap">
<h2>SPOC Dashboard</h2>
<div class="hint">For teachers: 1) check pending teams below, 2) open the team page to fix, 3) export CSV for records. <a href="teams.html">Start with Teams →</a></div>
<div class="card"><div class="row">
<div><label>Mentor</label><select id="fMentor"><option value="">All</option></select></div>
<div><label>Category</label><select id="fCat"><option value="">All</option><option value="software">software</option><option value="hardware">hardware</option></select></div>
<div><label>Status</label><select id="fStatus"><option value="">All</option><option value="pending">Needs work</option><option value="ready">Ready</option></select></div>
<div><label>&nbsp;</label><button onclick="load()">Show</button></div>
</div></div>
<div class="card"><table id="t"></table></div>
<div class="card"><h3>Who needs a reminder?</h3><div id="rem"></div>
<a href="http://localhost:5000/api/export.csv"><button>Export CSV for nodal centre</button></a></div>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const m = await get('/mentors');
  document.getElementById('fMentor').innerHTML = '<option value="">All</option>' + m.map(x => `<option value="${x.id}">${x.name} (${x.load}/${x.maxTeams})</option>`).join('');
  const q = `?mentor=${document.getElementById('fMentor').value}&category=${document.getElementById('fCat').value}&status=${document.getElementById('fStatus').value}`;
  const d = await get('/dashboard' + q);
  document.getElementById('t').innerHTML = '<tr><th>Team</th><th>PS</th><th>Mentor</th><th>Check</th><th>Pending items</th><th>Ready</th></tr>' +
    d.teams.map(t => {
      const pending = t.deliverables.filter(x => x.status !== 'approved').map(x => x.type).join(', ') || 'none';
      return `<tr><td><b>${t.teamName}</b><br><small>${t.id}</small></td><td>${t.psTitle}</td><td>${t.mentorName}</td>
      <td>${t.compositionError ? `<span class="badge bad">${t.compositionError}</span>` : '<span class="badge ok">Team OK</span>'}</td>
      <td>${pending}</td><td><b>${t.readiness}%</b></td></tr>`;
    }).join('');
  document.getElementById('rem').innerHTML = d.pendingReminders.map(r => `<p><b>${r.team}</b> (${r.lead}) – waiting on: ${r.missing.join(', ')}</p>`).join('') || '<p>All teams ready.</p>';
}
load();
</script></body></html>
