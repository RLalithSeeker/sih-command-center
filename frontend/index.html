<!doctype html><html><head><meta charset="utf-8"><title>SIH Command Center</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<nav><a href="index.html">Dashboard</a><a href="teams.html">Teams</a><a href="ps.html">Problem Statements</a><a href="mentors.html">Mentors</a><a href="deliverables.html">Deliverables</a></nav>
<div class="wrap">
<h2>SPOC Dashboard</h2>
<div class="card"><div class="row">
<div><label>Filter mentor</label><select id="fMentor"><option value="">All</option></select></div>
<div><label>Category</label><select id="fCat"><option value="">All</option><option value="software">software</option><option value="hardware">hardware</option></select></div>
<div><label>Status</label><select id="fStatus"><option value="">All</option><option value="pending">Pending</option><option value="ready">Ready</option></select></div>
<div><label>&nbsp;</label><button onclick="load()">Apply</button></div>
</div></div>
<div class="card"><table id="t"><tr><th>Team</th><th>PS</th><th>Mentor</th><th>Composition</th><th>Deliverables</th><th>Readiness</th></tr></table></div>
<div class="card"><h3>Pending reminders (show in review)</h3><div id="rem"></div>
<a href="http://localhost:5000/api/export.csv"><button>Export CSV</button></a></div>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const m = await get('/mentors');
  const sel = document.getElementById('fMentor');
  sel.innerHTML = '<option value="">All</option>' + m.map(x => `<option value="${x.id}">${x.name} (${x.load})</option>`).join('');
  const q = `?mentor=${sel.value}&category=${document.getElementById('fCat').value}&status=${document.getElementById('fStatus').value}`;
  const d = await get('/dashboard' + q);
  document.getElementById('t').innerHTML = '<tr><th>Team</th><th>PS</th><th>Mentor</th><th>Composition</th><th>Deliverables</th><th>Readiness</th></tr>' +
    d.teams.map(t => `<tr><td>${t.teamName}</td><td>${t.psTitle}</td><td>${t.mentorName}</td>
    <td>${t.compositionError ? `<span class="badge bad">${t.compositionError}</span>` : '<span class="badge ok">OK</span>'}</td>
    <td>${t.deliverables.map(x => x.type + ':' + x.status).join('<br>')}</td>
    <td><b>${t.readiness}%</b></td></tr>`).join('');
  document.getElementById('rem').innerHTML = d.pendingReminders.map(r => `<p><b>${r.team}</b> (${r.lead}) – pending: ${r.missing.join(', ')}</p>`).join('') || '<p>All ready.</p>';
}
load();
</script></body></html>
