<!doctype html><html><head><meta charset="utf-8"><title>Problem statements</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav><a href="index.html">Dashboard</a><a href="teams.html">Teams</a><a href="ps.html" class="on">Problem Statements</a><a href="mentors.html">Mentors</a><a href="deliverables.html">Deliverables</a></nav>
<div class="wrap">
<h2>Pick a problem statement</h2>
<div class="steps"><div class="step on">Step 1 – Choose team</div><div class="step">Step 2 – Choose PS</div></div>
<div class="card">
<p class="hint">Pick from lists, no ids to remember. Taken ones show who holds them.</p>
<label>Team</label><select id="teamSel"></select>
<label>Problem statement</label><select id="psSel"></select>
<label><input type="checkbox" id="dup" style="width:auto"> allow same PS as another team</label><br><br>
<button onclick="pick()">Save choice</button> <small id="m"></small>
</div>
<div class="card"><table id="t"></table></div>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const teams = await get('/teams');
  document.getElementById('teamSel').innerHTML = teams.map(t => `<option value="${t.id}">${t.teamName}</option>`).join('');
  const ps = await get('/ps');
  document.getElementById('psSel').innerHTML = ps.map(p => `<option value="${p.id}">${p.code} – ${p.title}${p.takenBy ? ' (taken: ' + p.takenBy + ')' : ''}</option>`).join('');
  document.getElementById('t').innerHTML = '<tr><th>Code</th><th>Title</th><th>Type</th><th>Org</th><th>Held by</th></tr>' +
    ps.map(p => `<tr><td>${p.code}</td><td>${p.title}</td><td>${p.category}</td><td>${p.org}</td><td>${p.takenBy || '– free'}</td></tr>`).join('');
}
async function pick() {
  try {
    const t = await post(`/teams/${document.getElementById('teamSel').value}/select-ps`, { psId: document.getElementById('psSel').value, allowDuplicate: document.getElementById('dup').checked });
    document.getElementById('m').textContent = t.teamName + ' now on ' + t.psTitle;
    load();
  } catch (e) { document.getElementById('m').textContent = e.message; }
}
load();
</script></body></html>
