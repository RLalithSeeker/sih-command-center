<!doctype html><html><head><meta charset="utf-8"><title>PS catalog</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav><a href="index.html">Dashboard</a><a href="teams.html">Teams</a><a href="ps.html">Problem Statements</a><a href="mentors.html">Mentors</a><a href="deliverables.html">Deliverables</a></nav>
<div class="wrap"><h2>Problem statements</h2><div class="card"><table id="t"></table></div>
<div class="card"><h3>Team selects PS</h3><input id="teamId" placeholder="team id (see Teams page)"><input id="psId" placeholder="ps id (e.g. ps1)"><label><input type="checkbox" id="dup" style="width:auto"> allow duplicate</label><button onclick="pick()">Select</button> <small id="m"></small></div></div>
<script src="js/app.js"></script>
<script>
async function load(){ const ps = await get('/ps'); document.getElementById('t').innerHTML = '<tr><th>ID</th><th>Code</th><th>Title</th><th>Cat</th><th>Org</th></tr>' + ps.map(p => `<tr><td>${p.id}</td><td>${p.code}</td><td>${p.title}</td><td>${p.category}</td><td>${p.org}</td></tr>`).join(''); }
async function pick(){ try{ await post(`/teams/${document.getElementById('teamId').value}/select-ps`, { psId: document.getElementById('psId').value, allowDuplicate: document.getElementById('dup').checked }); document.getElementById('m').textContent='Saved'; }catch(e){ document.getElementById('m').textContent=e.message; } }
load();
</script></body></html>
